name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
      - run: bash tools/ci-run.sh go vet ./...
      - run: bash tools/ci-run.sh go test -count=1 ./...
      - if: runner.os == 'Linux'
        run: bash tools/ci-run.sh go test -race -count=1 -short ./...
